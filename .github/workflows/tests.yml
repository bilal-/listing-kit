name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Show bash version
        run: bash --version | head -1
      - name: Install ImageMagick 6 for decoder compatibility tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y imagemagick-6.q16
          echo 'LK_TEST_IM6=1' >> "$GITHUB_ENV"
      - name: Run test suite
        run: bash tests/run.sh
