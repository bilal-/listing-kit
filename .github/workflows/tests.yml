name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Show bash version
        run: bash --version | head -1
      - name: Install ImageMagick 6 for decoder compatibility tests
        if: runner.os == 'Linux'
        run: |
          if ! command -v convert-im6.q16 >/dev/null 2>&1 || ! command -v identify-im6.q16 >/dev/null 2>&1; then
            sudo apt-get update && sudo apt-get install -y imagemagick-6.q16
          fi
          echo 'LK_TEST_IM6=1' >> "$GITHUB_ENV"
      - name: Run test suite
        run: bash tests/run.sh
