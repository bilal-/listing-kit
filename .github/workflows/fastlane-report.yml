name: Report fastlane contract drift
on:
  workflow_run:
    workflows: ['Fastlane contracts']
    types: [completed]

# Read only the artifact name. This privileged job never checks out or runs PR code.
jobs:
  report:
    permissions:
      actions: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - name: Report a latest-version failure
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          failure=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "fastlane-latest-failed") | .name')
          [ -n "$failure" ] || exit 0
          title='Latest fastlane failed the listing-kit contract'
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          link="$GITHUB_SERVER_URL/$REPO/actions/runs/$RUN_ID"
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Failed contract run: $link"
          else
            gh issue create --repo "$REPO" --title "$title" --body "Failed contract run: $link"
          fi
