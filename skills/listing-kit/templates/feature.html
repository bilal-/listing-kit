<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<meta charset="utf-8">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/fonts.css">
<style>
  /* Play feature graphic (1024x500) and Apple header canvases: brand, headline, detail,
     centred, with generous margins so store crops do not cut the text. */
  body{justify-content:center;gap:calc(4*var(--u));padding:calc(8*var(--u)) 10%}
  .brand{display:flex;justify-content:center;align-items:center;gap:calc(3*var(--u))}
  .brand img.logo{max-height:calc(20*var(--u));max-width:70%}
  .brand img.icon{width:calc(22*var(--u));height:calc(22*var(--u));border-radius:calc(5*var(--u))}
  .brand .name{font-size:calc(11*var(--u));font-family:var(--font-headline);font-weight:700}
  .headline{font-size:calc(var(--headline-size,11)*var(--u))}
  .detail{font-size:calc(var(--detail-size,5)*var(--u))}
</style>
<body>
  <div class="brand">{{brand}}</div>
  <h1 class="headline" data-check="text">{{headline}}</h1>
  <p class="detail" data-check="text">{{detail}}</p>
</body>
</html>
