<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<meta charset="utf-8">
<link rel="stylesheet" href="/base.css">
<link rel="stylesheet" href="/fonts.css">
<style>
  /* Large-screen layout: no device frame, a caption band above the capture. Google
     asks that large-screen screenshots avoid device imagery and heavy text. */
  body{background:var(--bg-b)}
  .band{flex:0 0 auto;width:100%;padding:calc(3.2*var(--u)) calc(6*var(--u));background:linear-gradient(var(--bg-a),var(--bg-b));text-align:center}
  .headline{font-size:calc(var(--headline-size,5.2)*var(--u))}
  .detail{font-size:calc(var(--detail-size,2.8)*var(--u));margin-block-start:calc(1*var(--u))}
  .stage{flex:1 1 0;min-height:0;width:100%;display:flex;justify-content:center;align-items:flex-start}
  .stage img{display:block;height:100%;max-width:100%}
  body[data-fit="contain"] .stage img{object-fit:contain;object-position:top}
  body[data-fit="cover"] .stage img{width:100%;object-fit:cover;object-position:top}
</style>
<body data-fit="{{fit}}">
  <div class="band" data-check="band"><h1 class="headline" data-check="text">{{caption}}</h1><p class="detail" data-check="text">{{detail}}</p></div>
  <div class="stage"><img src="/raw.png" alt="" data-check="device"></div>
</body>
</html>
